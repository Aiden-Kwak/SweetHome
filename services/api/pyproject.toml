[project]
name = "policymap-api"
version = "0.1.0"
description = "PolicyMap API and scenario orchestration service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.10.0",
  "pypdf>=6.0,<7",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "jsonschema[format]>=4.23.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policymap_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
